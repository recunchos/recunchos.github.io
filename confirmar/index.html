<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://fwfwfbtzarmwalfaxelh.supabase.co">
<script src="/frame-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="confirm.title">Confirmación — Recunchos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F8FA">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/idioma.css">
</head>
<body>
<a class="skip" href="#confirmar" data-i18n="skip">Saltar ao contido</a>
<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="/" data-i18n-attr="aria-label:brand.home" aria-label="Recunchos, inicio">
      <img class="brand__mark" src="/img/favicon-512.png" width="32" height="32" alt="">
      <span class="brand__name">Recunchos</span>
    </a>
    <div class="topbar__end">
      <div data-lang-slot></div>
    </div>
  </div>
</header>
<main class="wrap" id="confirmar">
  <article class="auth">
    <h1 data-i18n="confirm.h">Confirmación</h1>
    <p id="estado" role="status" aria-live="polite">Comprobando a ligazón…</p>
    <p data-i18n="confirm.stay">Non se abre a app soa.</p>
    <form id="clave" hidden novalidate>
      <label for="password" data-i18n="confirm.password">Contrasinal novo</label>
      <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="clave-hint clave-error" aria-invalid="false" required>
      <label for="password2" data-i18n="confirm.passwordAgain">Repite o contrasinal</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" aria-describedby="clave-error" aria-invalid="false" required>
      <p class="hint" id="clave-hint" data-i18n="signup.hint">Mínimo 8 caracteres, cunha letra e un número.</p>
      <p class="err" id="clave-error" role="alert" hidden></p>
      <button type="submit" data-i18n="confirm.save">Gardar contrasinal</button>
    </form>
    <div class="links" id="seguir">
      <a href="/" data-i18n="confirm.home">Ir ao inicio</a>
      <a href="/perfil/" data-i18n="confirm.perfil">O meu perfil</a>
      <a href="/entrar/" data-i18n="confirm.entrar">Iniciar sesión</a>
    </div>
  </article>
</main>
<footer class="footer">
  <div class="wrap footer__in">
    <p class="footer__brand"><img src="/img/favicon-512.png" width="32" height="32" alt="">Recunchos</p>
    <p class="footer__mail"><a href="mailto:holarecunchos@hotmail.com">holarecunchos@hotmail.com</a></p>
    <p class="footer__note" data-i18n="footer.note">Se vas de furanchos, que conduza alguén que non beba.</p>
    <p class="footer__legal"><a href="/legal.html" data-i18n="nav.legal">Legal</a> · <a href="/eliminar-cuenta.html" data-i18n="footer.delete">Eliminar conta</a></p>
  </div>
</footer>
<script src="/i18n.js"></script>
<script src="/idioma.js"></script>
<script src="/sesion.js"></script>
<script src="/confirmar/confirmar.js"></script>
</body>
</html>
