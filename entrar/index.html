<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Recunchos</title>
<meta name="theme-color" content="#F3F8FA">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#entrar">Saltar al contenido</a>
<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="/" aria-label="Recunchos, inicio">
      <img class="brand__mark" src="/img/favicon-512.png" width="32" height="32" alt="">
      <span class="brand__name">Recunchos</span>
    </a>
    <div class="topbar__end">
      <nav aria-label="Secciones">
        <ul>
          <li><a href="/#funciones">Funciones</a></li>
          <li><a href="/furanchos/">Furanchos</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
<main class="wrap" id="entrar">
  <form class="auth" id="form">
    <h1>Iniciar sesión</h1>
    <p>Entra con el correo de tu cuenta. Sigues en la web.</p>
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="error" hidden></p>
    <button type="submit">Entrar</button>
    <div class="links">
      <a href="/app/olvidada">¿Olvidaste tu contraseña?</a>
      <a href="/app/registro">Crear cuenta</a>
    </div>
  </form>
</main>
<footer class="footer">
  <div class="wrap footer__in">
    <p class="footer__brand"><img src="/img/favicon-512.png" width="32" height="32" alt="">Recunchos</p>
    <p class="footer__mail"><a href="mailto:holarecunchos@hotmail.com">holarecunchos@hotmail.com</a></p>
    <p class="footer__note">Si vas de furanchos, que conduzca alguien que no beba.</p>
    <p class="footer__legal"><a href="/legal.html">Legal</a></p>
  </div>
</footer>
<script src="/sesion.js"></script>
<script>
(function () {
  var S = window.RecunchosSesion;
  var params = new URLSearchParams(location.search);
  var next = S.safeNext(params.get("next"));
  if (S.read()) {
    location.replace(next);
    return;
  }
  var form = document.getElementById("form");
  var error = document.getElementById("error");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    error.hidden = true;
    var button = form.querySelector("button[type=submit]");
    button.disabled = true;
    S.signIn(form.email.value, form.password.value).then(function (result) {
      button.disabled = false;
      if (!result.ok) {
        error.textContent = result.message;
        error.hidden = false;
        return;
      }
      location.assign(next);
    });
  });
})();
</script>
</body>
</html>
