<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha — Recunchos</title>
<meta name="theme-color" content="#F3F8FA">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="/" aria-label="Recunchos, inicio">
      <img class="brand__mark" src="/img/favicon-512.png" width="32" height="32" alt="">
      <span class="brand__name">Recunchos</span>
    </a>
    <div class="topbar__end">
      <nav aria-label="Secciones">
        <ul>
          <li><a href="/furanchos/">Furanchos</a></li>
          <li><a href="/#funciones">Funciones</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
<main id="contenido">
  <section class="section">
    <div class="wrap narrow">
      <p class="note"><a href="/furanchos/">Todos los furanchos</a></p>
      <article class="ficha" id="ficha"><p class="note">Cargando ficha…</p></article>
    </div>
  </section>
</main>
<footer class="footer">
  <div class="wrap footer__in">
    <p class="footer__brand"><img src="/img/favicon-512.png" width="32" height="32" alt="">Recunchos</p>
    <p class="footer__mail"><a href="mailto:holarecunchos@hotmail.com">holarecunchos@hotmail.com</a></p>
    <p class="footer__note">Si vas de furanchos, que conduzca alguien que no beba.</p>
    <p class="footer__legal"><a href="/legal.html">Legal</a></p>
  </div>
</footer>
<script src="/furanchos/datos.js"></script>
<script>
(function () {
  var D = window.RecunchosDatos;
  var root = document.getElementById("ficha");
  var id = new URLSearchParams(location.search).get("id");
  if (!id) {
    root.innerHTML = "<p>No hay ninguna ficha seleccionada.</p>";
    return;
  }
  D.loadOne(id).then(function (row) {
    if (!row) {
      root.innerHTML = "<p>No encontramos esta ficha.</p>";
      return;
    }
    document.title = row.name + " — Recunchos";
    var photo = D.photoUrl(row.cover_photo_id);
    var place = [row.municipality, row.comarca, row.province].filter(Boolean).join(" · ");
    var status = D.statusLabel(row);
    var wines = D.listText(row.wine_types);
    var food = D.listText(row.food).concat(D.listText(row.menu));
    var maps = D.mapsUrl(row);
    var address = row.address || "Dirección no publicada.";
    if (row.coords_approximate && row.address) address += " La posición en el mapa es aproximada.";
    root.innerHTML =
      '<div class="ficha__hero">' +
        (photo ? '<img src="' + D.esc(photo) + '" alt="">' : "") +
        "<div><p class=\"note\">" + D.esc(row.local_type_label || "Furancho") + "</p>" +
        "<h2>" + D.esc(row.name) + "</h2>" +
        "<p>" + D.esc(place) + (status ? ' · <span class="status">' + D.esc(status) + "</span>" : "") + "</p>" +
        (maps ? '<p><a class="open-map" href="' + D.esc(maps) + '" rel="noopener">Cómo llegar</a></p>' : "") +
        "</div></div>" +
      "<dl>" +
      "<div><dt>Dirección</dt><dd>" + D.esc(address) + "</dd></div>" +
      (row.season_label ? "<div><dt>Temporada</dt><dd>" + D.esc(row.season_label) + "</dd></div>" : "") +
      "<div><dt>Horario</dt><dd>" + D.hoursHtml(row) + (row.closed_note ? "<p>" + D.esc(row.closed_note) + "</p>" : "") + "</dd></div>" +
      "<div><dt>Vinos</dt><dd>" + D.esc(wines.length ? wines.join(", ") : "Sin vinos publicados.") + "</dd></div>" +
      "<div><dt>Tapas</dt><dd>" + D.esc(food.length ? food.join(", ") : "Sin tapas publicadas.") + "</dd></div>" +
      (row.description ? "<div><dt>La casa</dt><dd>" + D.esc(row.description) + "</dd></div>" : "") +
      "</dl>";
  }).catch(function () {
    root.innerHTML = "<p>No se ha podido cargar la ficha.</p>";
  });
})();
</script>
</body>
</html>
