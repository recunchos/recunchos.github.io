<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Recunchos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F8FA">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<script>
  // GitHub Pages sirve este 404 en la URL pedida. Las rutas de la app
  // (/app/explorar, etc.) no son archivos: se reenvían a /app/?/ruta y
  // /app/index.html restaura el path antes de arrancar Expo Router.
  (function () {
    var path = window.location.pathname;
    if (path !== '/app' && path.indexOf('/app/') !== 0) return;
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  })();
</script>
</head>
<body>
<main class="notfound">
  <img class="notfound__logo" src="/img/favicon-512.png" width="120" height="120" alt="Icono de Recunchos">
  <h1>Página no encontrada</h1>
  <p><a href="/">Volver a Recunchos</a></p>
</main>
</body>
</html>
